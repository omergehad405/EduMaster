<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EduMaster</title>
    <script>
      // GitHub Pages SPA redirect trick
      // When GH Pages returns a 404 for a deep link, this page
      // encodes the path into a query param and redirects to the root.
      var segmentCount = 1; // number of path segments in the repo name (EduMaster = 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
